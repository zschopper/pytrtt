# Copy this file to pytrtt.local.toml and adjust paths for games you own.
# pytrtt.local.toml is ignored by Git; this example contains dummy/default paths.
# Relative paths use this file's directory. Empty paths are unset.
# Defining a game does not enable integration tests or claim format support.
# install_dir: application/extraction; original_dir: clean test copy;
# translated_dir: verified translated test copy; samples_dir: game/build sample folder.
# Platform paths override the shared fields below. Use literal quotes for Windows paths.
