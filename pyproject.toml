[project]
name = "pytrtt"
version = "0.2.0"
description = "Tomb Raider Translation Toolkit"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pyside6>=6.10.1,<6.11; sys_platform == 'win32'",
    "pyside6>=6.8,<6.9; sys_platform != 'win32' and python_version < '3.14'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "pymarkdownlnt>=0.9",
]
packaging = ["pillow>=11", "pyinstaller>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: explicitly enabled checks using game samples",
    "game(name, build): game and build required by a local integration test",
    "toolchain: development environment smoke checks",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["pytrtt", "scripts", "tests"]
